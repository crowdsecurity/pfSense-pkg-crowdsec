version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "kind/dependencies"
      - "github-actions"
    groups:
      github-actions:
        update-types:
          - "major"
          - "minor"
          - "patch"

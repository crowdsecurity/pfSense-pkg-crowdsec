name: Build packages

# Builds crowdsec, crowdsec-firewall-bouncer and pfSense-pkg-crowdsec for
# every supported FreeBSD version / architecture, using the ports from
# crowdsecurity/packaging-freebsd (pfSense branch) as an overlay.
#
# - prerelease published: all archives are built from the release tag and
#   attached to that release
# - manual run: archives are uploaded as workflow artifacts; the "arch" input
#   restricts which archives are produced
#
# Everything runs in amd64 VMs: amd64 with poudriere, arm64 and armv7
# cross-compiled (native Go and clang, cgo for mattn sqlite) against a sysroot
# installed from the target's pkgbase repository. See .github/scripts/build-packages.sh

on:
  release:
    types: [prereleased]
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture(s) to build'
        type: choice
        options:
          - all
          - amd64
          - arm64
          - armv7
        default: all
      packaging_ref:
        description: 'Branch/tag of crowdsecurity/packaging-freebsd'
        default: 'crowdsec-wasm'
        required: true
      ports_branch:
        description: 'Branch of the FreeBSD ports tree'
        default: 'main'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # the special pfSense branch: crowdsec built with WebAssembly re2, no abseil
  PACKAGING_REF: ${{ inputs.packaging_ref || 'crowdsec-wasm' }}
  PORTS_BRANCH: ${{ inputs.ports_branch || 'main' }}

jobs:
  build:
    name: FreeBSD ${{ matrix.freebsd.major }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        freebsd:
          # release: VM image (vmactions/freebsd-vm). The host kernel should be >= the
          #          target, for the amd64 poudriere jail.
          # base:    pkgbase repository, for the amd64 jail and the arm sysroots
          # major:   target version, used in the archive names
          - { release: '14.5', base: 'base_release_5', major: '14' }
          - { release: '15.1', base: 'base_release_1', major: '15' }
          # vmactions has no 16.0 image yet (still CURRENT): build on the newest
          # available host. Poudriere warns that the jail is newer than the kernel.
          # Switch release to '16.0' as soon as vmactions publishes it.
          - { release: '15.1', base: 'base_latest', major: '16' }

    env:
      FREEBSD_MAJOR: ${{ matrix.freebsd.major }}
      BASE_REPO: ${{ matrix.freebsd.base }}
      # empty on release events: build everything
      ARCHES: ${{ (inputs.arch == '' || inputs.arch == 'all') && 'amd64 arm64 armv7' || inputs.arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Build in FreeBSD ${{ matrix.freebsd.release }} VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.freebsd.release }}
          usesh: true
          mem: 12288
          envs: 'PACKAGING_REF PORTS_BRANCH FREEBSD_MAJOR BASE_REPO ARCHES'
          prepare: |
            pkg install -y git-lite poudriere-devel
          # don't fail here: the VM only copies files back on success,
          # and we want the logs in any case
          run: |
            sh .github/scripts/build-packages.sh || touch build-failed

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.freebsd.major }}
          path: build-logs/
          if-no-files-found: ignore

      - name: Check build result
        run: |
          if [ -e build-failed ]; then
            echo "::error::build failed for FreeBSD $FREEBSD_MAJOR, see the logs artifact"
            exit 1
          fi
          for a in $ARCHES; do
            [ "$a" = arm64 ] && a=aarch64
            f="out/freebsd-$FREEBSD_MAJOR-$a.tar"
            if [ ! -s "$f" ]; then
              echo "::error::missing $f"
              exit 1
            fi
            echo "== $f"
            tar -tvf "$f"
          done

      - name: Upload archives
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.freebsd.major }}
          path: out/freebsd-*.tar
          if-no-files-found: error

  release:
    name: Attach archives to the prerelease
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          ls -l dist
          for f in dist/*.tar; do
            echo "== $f"
            tar -tf "$f"
          done
          # --clobber: re-running the workflow replaces the previous archives
          gh release upload "$TAG" dist/*.tar --clobber

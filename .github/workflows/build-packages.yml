name: Build packages

# Builds crowdsec, crowdsec-firewall-bouncer and pfSense-pkg-crowdsec for
# every supported FreeBSD version / architecture, using the ports from
# crowdsecurity/packaging-freebsd (pfSense branch) as an overlay.
#
# - prerelease published: all archives are built from the release tag and
#   attached to that release
# - pull request / manual run: archives are uploaded as workflow artifacts;
#   for manual runs, the "arch" input selects the architecture(s)
#
# One independent job per FreeBSD version and architecture, all in amd64 VMs:
# - amd64: poudriere
# - arm64 / armv7: cross-compiled (native Go and clang, cgo for mattn sqlite)
#   against a sysroot installed from the target's pkgbase repository
# Each job builds its own pfSense-pkg-crowdsec (NO_ARCH).
# See .github/scripts/build-packages.sh

on:
  release:
    types: [prereleased]
  pull_request:
    paths:
      - '.github/workflows/build-packages.yml'
      - '.github/scripts/build-packages.sh'
      - 'security/**'
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture(s) to build'
        type: choice
        options:
          - all
          - amd64
          - arm64
          - armv7
        default: all
      packaging_ref:
        description: 'Branch/tag of crowdsecurity/packaging-freebsd'
        default: 'crowdsec-wasm'
        required: true
      ports_branch:
        description: 'Branch of the FreeBSD ports tree'
        default: 'main'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # the special pfSense branch: crowdsec built with WebAssembly re2, no abseil
  PACKAGING_REF: ${{ inputs.packaging_ref || 'crowdsec-wasm' }}
  PORTS_BRANCH: ${{ inputs.ports_branch || 'main' }}

jobs:
  amd64:
    name: FreeBSD ${{ matrix.freebsd.major }} amd64
    # inputs.arch is empty on release and pull request events: build everything
    if: ${{ (inputs.arch || 'all') == 'all' || inputs.arch == 'amd64' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        freebsd: &freebsd
          # release: VM image (vmactions/freebsd-vm). The host kernel should be >= the
          #          target, for the amd64 poudriere jail.
          # base:    pkgbase repository, for the amd64 jail and the arm sysroots
          # major:   target version, used in the archive names
          - { release: '14.5', base: 'base_release_5', major: '14' }
          - { release: '15.1', base: 'base_release_1', major: '15' }
          # vmactions has no 16.0 image yet (still CURRENT): build on the newest
          # available host. Poudriere warns that the jail is newer than the kernel.
          # Switch release to '16.0' as soon as vmactions publishes it.
          - { release: '15.1', base: 'base_latest', major: '16' }

    env:
      FREEBSD_MAJOR: ${{ matrix.freebsd.major }}
      BASE_REPO: ${{ matrix.freebsd.base }}
      TARGET: amd64

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build in FreeBSD ${{ matrix.freebsd.release }} VM
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          release: ${{ matrix.freebsd.release }}
          usesh: true
          mem: 12288
          envs: 'PACKAGING_REF PORTS_BRANCH FREEBSD_MAJOR BASE_REPO TARGET'
          prepare: |
            pkg install -y git-lite poudriere-devel
          # don't fail here: the VM only copies files back on success,
          # and we want the logs in any case
          run: |
            sh .github/scripts/build-packages.sh || touch build-failed

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: logs-${{ matrix.freebsd.major }}-amd64
          path: build-logs/
          if-no-files-found: ignore

      - name: Check build result
        run: |
          if [ -e build-failed ]; then
            echo "::error::build failed for FreeBSD $FREEBSD_MAJOR amd64, see the logs artifact"
            exit 1
          fi
          tar -tvf "out/freebsd-$FREEBSD_MAJOR-amd64.tar"

      - name: Upload archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.freebsd.major }}-amd64
          path: out/freebsd-*.tar
          if-no-files-found: error

  cross:
    name: FreeBSD ${{ matrix.freebsd.major }} ${{ matrix.arch.name }}
    if: ${{ (inputs.arch || 'all') != 'amd64' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        freebsd: *freebsd
        # asset: architecture in the archive name (uname -m, arm64 -> aarch64)
        arch: ${{ fromJSON(contains(fromJSON('["arm64","armv7"]'), inputs.arch) && format('[{{"name":"{0}","asset":"{1}"}}]', inputs.arch, inputs.arch == 'arm64' && 'aarch64' || 'armv7') || '[{"name":"arm64","asset":"aarch64"},{"name":"armv7","asset":"armv7"}]') }}

    env:
      FREEBSD_MAJOR: ${{ matrix.freebsd.major }}
      BASE_REPO: ${{ matrix.freebsd.base }}
      TARGET: ${{ matrix.arch.name }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cross-compile in FreeBSD ${{ matrix.freebsd.release }} VM
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          release: ${{ matrix.freebsd.release }}
          usesh: true
          mem: 12288
          envs: 'PACKAGING_REF PORTS_BRANCH FREEBSD_MAJOR BASE_REPO TARGET'
          prepare: |
            pkg install -y git-lite
          # don't fail here: the VM only copies files back on success,
          # and we want the logs in any case
          run: |
            sh .github/scripts/build-packages.sh || touch build-failed

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: logs-${{ matrix.freebsd.major }}-${{ matrix.arch.asset }}
          path: build-logs/
          if-no-files-found: ignore

      - name: Check build result
        run: |
          f="out/freebsd-$FREEBSD_MAJOR-${{ matrix.arch.asset }}.tar"
          if [ -e build-failed ] || [ ! -s "$f" ]; then
            echo "::error::build failed for FreeBSD $FREEBSD_MAJOR $TARGET, see the logs artifact"
            exit 1
          fi
          tar -tvf "$f"

      - name: Upload archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: packages-${{ matrix.freebsd.major }}-${{ matrix.arch.asset }}
          path: out/freebsd-*.tar
          if-no-files-found: error

  release:
    name: Attach archives to the prerelease
    if: github.event_name == 'release'
    needs: [amd64, cross]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -eu
          ls -l dist
          [ "$(ls dist/*.tar | wc -l)" -eq 9 ] || { echo "::error::expected 9 archives"; exit 1; }
          for f in dist/*.tar; do
            echo "== $f"
            tar -tf "$f"
          done
          # --clobber: re-running the workflow replaces the previous archives
          gh release upload "$TAG" dist/*.tar --clobber
